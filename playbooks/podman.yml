---
- name: Creating and Managing Podman Containers
  hosts: servers
  become: true

  tasks:
   - name: Run Container
     containers.podman.podman_container:
       name: apache-container  
       image: docker.io/library/httpd:latest  
       state: started
       publish: "8080:80"

   - name: Manage systemd using Quadlet
     ansible.builtin.copy:
       dest: /etc/containers/systemd/apache.container
       mode: '0644'
       content: |
         [Unit]
         Description=My settings to auto-run podman
         
         [Container]
         Image=docker.io/library/httpd:latest
         ContainerName=apache-container
         PublishPort=8080:80

         [Install]
         WantedBy=multi-user.target

   - name: Auto-reload systemd & enable/start Apache container
     ansible.builtin.systemd_service:
       daemon_reload: true
       name: apache.service
       state: started
       enabled: true
