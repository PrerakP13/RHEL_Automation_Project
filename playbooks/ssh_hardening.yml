---
- name: Creating SSH hardening
  hosts: servers
  become: true

  tasks: 
   - name: Stop the root login! Lets GO!!!
     ansible.builtin.lineinfile:
       path: "/etc/ssh/sshd_config"
       search_string: "PermitRootLogin"
       line: "PermitRootLogin no"
       validate: "/usr/sbin/sshd -t -f %s"

   - name: Stop the root login in another file :D
     ansible.builtin.lineinfile:
       path: "/etc/ssh/sshd_config.d/01-permitrootlogin.conf"
       search_string: "PermitRootLogin"
       line: "PermitRootLogin no"
       validate: "/usr/sbin/sshd -t -f %s"

   - name: Stop password authentication! Right on!
     ansible.builtin.lineinfile:
       path: "/etc/ssh/sshd_config"
       search_string: "PasswordAuthentication"
       line: "PasswordAuthentication no"
       validate: "/usr/sbin/sshd -t -f %s"

   - name: Enable Public Key Authentication, Duh!
     ansible.builtin.lineinfile:
       path: "/etc/ssh/sshd_config"
       search_string: "PubkeyAuthentication"
       line: "PubkeyAuthentication yes"
       validate: "/usr/sbin/sshd -t -f %s"

   
   - name: Reconfigure the changes NOW!
     ansible.builtin.systemd_service:
       name: sshd
       state: reloaded
